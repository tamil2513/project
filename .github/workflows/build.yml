name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'          # Triggers when you push a tag like v1.0.0
  workflow_dispatch:  # Also lets you trigger manually from GitHub website

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install Python dependencies + PyInstaller
      - name: Install Python dependencies
        run: |
          pip install flask reportlab pyinstaller

      # 4. Bundle server.py into server.exe using PyInstaller
      - name: Bundle Python backend into server.exe
        working-directory: backend
        run: |
          pyinstaller server.spec
          echo "PyInstaller done"
          dir dist

      # 5. Move server.exe to where electron-builder expects it
      - name: Move bundled server to backend/dist/server/
        run: |
          mkdir -p backend\dist\server
          copy backend\dist\server.exe backend\dist\server\server.exe
        shell: cmd

      # 6. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 7. Install Electron + electron-builder
      - name: Install Node dependencies
        run: npm install

      # 8. Build Windows installer
      - name: Build Windows .exe installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. Upload the installer as a downloadable artifact
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SareePhotography-Windows-Installer
          path: dist/*.exe
          retention-days: 30

      # 10. Also create a GitHub Release with the installer attached
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          name: Saree Photography ${{ github.ref_name }}
          body: |
            ## Saree Photography Booking System ${{ github.ref_name }}

            ### Install on Windows
            1. Download `SareePhotography-Setup.exe` below
            2. Double-click to install
            3. Launch from Desktop shortcut

            No Python or Node.js required — everything is bundled.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
